allowBuilds:
  # Ships platform binaries; its install script is only a fallback.
  '@bufbuild/buf': false
  # Node-only runtime for transformers.js; the app uses onnxruntime-web in the browser.
  onnxruntime-node: false
  # Pulled in by onnxruntime-node; its install script only builds a CLI.
  protobufjs: false
  workerd: true
packageExtensions:
  # dependency-cruiser parses TypeScript with the compiler's JS API, which the
  # native TypeScript 7 doesn't publish yet. Give it TypeScript 6 of its own;
  # the app still compiles with TypeScript 7.
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3
overrides:
  # fflate before 0.7.5 can loop forever unzipping a malformed ZIP64 archive,
  # a security advisory fixed in 0.7.5. It arrives only through vinext →
  # @vercel/og → satori, which pins 0.7.3 exactly, so Dependabot can't bump it.
  # Nothing in A4 imports @vercel/og, and no build output contains fflate.
  'fflate@<0.7.5': 0.7.5
