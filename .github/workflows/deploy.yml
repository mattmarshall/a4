name: CI and deploy

# Every push and pull request runs the checks. Pushes to main (and manual runs
# on main) then deploy the Worker to https://a4.marsh.build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      # buf breaking compares proto/ with the pull request's base, or with the
      # previous main commit on a push. The checkout is shallow, so fetch it.
      - name: Fetch the proto comparison base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ref="$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            ref="$BEFORE"
          else
            ref=main
          fi
          if git fetch --no-tags --depth=1 origin "$ref"; then
            echo "PROTO_BASE=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          else
            echo "::warning::Couldn't fetch $ref; buf breaking compares with the checked-out main instead."
          fi
      - run: pnpm proto:check
      - run: pnpm build
      - run: pnpm check:bundle

  deploy:
    name: Deploy to a4.marsh.build
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://a4.marsh.build
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy (see README)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds, uploads the Worker version, promotes it, and applies the
      # a4.marsh.build custom domain from cloudflare.config.ts.
      - run: pnpm run deploy
      - name: Smoke test the live site
        run: |
          for path in / /why; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "https://a4.marsh.build$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://a4.marsh.build/does-not-exist")
          echo "/does-not-exist -> $code"
          [ "$code" = "404" ] || exit 1
