version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  # The worker transport is internal to a worker and the page that starts it,
  # which always ship together, so its frame can change freely.
  ignore:
    - proto/a4/v1/rpc.proto
  # refactor-typed-contracts moved RpcFrame and RpcError from model.proto to
  # rpc.proto. Remove this exception once that change has shipped.
  ignore_only:
    MESSAGE_NO_DELETE:
      - proto/a4/v1/model.proto
